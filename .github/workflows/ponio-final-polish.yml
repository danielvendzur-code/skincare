name: PONIO final polish
on:
  push:
    branches:
      - agent/skincare-ponio-kava-parity
permissions:
  contents: write
jobs:
  final-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skincare-ponio-kava-parity
          fetch-depth: 0
      - name: Fix verified category URL and add regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path('src/brands/ponio/config.js')
          text = config.read_text()
          old = 'https://ponio.sk/collections/plet-pletove-kremy'
          new = 'https://ponio.sk/collections/pletove-kremy'
          if old not in text:
              raise SystemExit('Expected stale PONIO face URL not found')
          config.write_text(text.replace(old, new, 1))

          test = Path('tests/ponio.spec.js')
          t = test.read_text()
          needle = "    await expect(page.locator('.ponio-category-link[data-category=\"face\"]')).toContainText('Pleť');\n"
          assertion = "    await expect(page.locator('.ponio-category-link[data-category=\"face\"]')).toHaveAttribute('href', 'https://ponio.sk/collections/pletove-kremy');\n"
          if assertion not in t:
              if needle not in t:
                  raise SystemExit('Expected PONIO face-category assertion anchor not found')
              t = t.replace(needle, needle + assertion, 1)
              test.write_text(t)

          workflow = Path('.github/workflows/ponio-final-polish.yml')
          workflow.unlink()
          PY
      - name: Commit final PONIO fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PONIO face category destination and lock regression"
          git push origin HEAD:agent/skincare-ponio-kava-parity
