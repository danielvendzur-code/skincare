name: Final six-brand integration

on:
  push:
    branches:
      - agent/skincare-kava-parity-coordination
    paths:
      - 'integration/**'
      - '.github/workflows/final-six-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout coordination branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve integration sources
        run: |
          cp integration/final-six-main.jsx /tmp/final-main.jsx
          cp integration/final-chat.js /tmp/final-chat.js
          cp integration/final-family.spec.js /tmp/final-family.spec.js
          cp integration/final-playwright.config.js /tmp/final-playwright.config.js

      - name: Fetch all parity branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Assemble six green brand heads
        run: |
          git checkout -B final-integration origin/agent/skincare-two-kava-parity

          git checkout origin/agent/skincare-mylo-kava-parity -- \
            src/brands/mylo public/assets/brands/mylo tests/mylo.spec.js MYLO_KAVA_PARITY_AUDIT.md

          git checkout origin/agent/skincare-ponio-kava-parity -- \
            src/brands/ponio public/assets/brands/ponio tests/ponio.spec.js tests/ponio-assets.spec.js PONIO_KAVA_PARITY_AUDIT.md

          git checkout origin/agent/skincare-bellcoria-kava-parity -- \
            src/brands/bellcoria public/assets/brands/bellcoria tests/bellcoria.spec.js BELLCORIA_KAVA_PARITY_AUDIT.md src/a11y-focus.js

          git checkout origin/agent/skincare-biofy-kava-parity -- \
            src/brands/biofy public/assets/brands/biofy tests/biofy.spec.js BIOFY_KAVA_PARITY_AUDIT.md

          git checkout origin/agent/skincare-anemone-kava-parity -- \
            src/brands/anemone public/assets/brands/anemone tests/anemone.spec.js ANEMONE_KAVA_PARITY_AUDIT.md

          cp /tmp/final-main.jsx src/main.jsx
          cp /tmp/final-chat.js api/chat.js
          cp /tmp/final-family.spec.js tests/family.spec.js
          cp /tmp/final-playwright.config.js playwright.config.js

          cat > FINAL_INTEGRATION_SOURCES.md <<EOF
          # Final six-brand integration sources

          Generated by the guarded integration workflow.

          - MYLO: $(git rev-parse origin/agent/skincare-mylo-kava-parity)
          - PONIO: $(git rev-parse origin/agent/skincare-ponio-kava-parity)
          - TWO COSMETICS: $(git rev-parse origin/agent/skincare-two-kava-parity)
          - BELLCORIA: $(git rev-parse origin/agent/skincare-bellcoria-kava-parity)
          - BIOFY: $(git rev-parse origin/agent/skincare-biofy-kava-parity)
          - ANEMONE: $(git rev-parse origin/agent/skincare-anemone-kava-parity)
          EOF

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete six-brand Playwright suite
        env:
          CI: 'true'
        run: pnpm test

      - name: Reject unresolved integration markers
        run: |
          if grep -R -n -E '<<<<<<<|=======|>>>>>>>' src api tests --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg'; then
            echo 'Merge conflict marker found.'
            exit 1
          fi

      - name: Commit and publish final integration only after green QA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src api tests public/assets/brands playwright.config.js FINAL_INTEGRATION_SOURCES.md \
            MYLO_KAVA_PARITY_AUDIT.md PONIO_KAVA_PARITY_AUDIT.md TWO_KAVA_PARITY_AUDIT.md \
            BELLCORIA_KAVA_PARITY_AUDIT.md BIOFY_KAVA_PARITY_AUDIT.md ANEMONE_KAVA_PARITY_AUDIT.md
          git commit -m 'Integrate six skincare storefronts after full green QA' || true
          git push --force origin HEAD:agent/skincare-kava-parity-final
