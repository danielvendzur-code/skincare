name: Bellcoria Kava parity QA

on:
  push:
    branches:
      - agent/skincare-bellcoria-kava-parity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Edge
        run: pnpm exec playwright install --with-deps msedge

      - name: Build
        run: pnpm build

      - name: Family and Bellcoria Playwright
        run: pnpm test

      - name: Start QA server
        run: |
          pnpm dev --host 127.0.0.1 --port 4173 > /tmp/skincare-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ukazka/bellcoria > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/skincare-vite.log
          exit 1

      - name: Capture Bellcoria QA states
        env:
          PLAYWRIGHT_CHANNEL: msedge
        run: node scripts/capture-bellcoria-qa.mjs

      - name: Build Bellcoria QA board
        run: |
          python -m pip install --quiet pillow
          python scripts/montage-bellcoria.py

      - name: Commit verified Bellcoria screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/screenshots/bellcoria-desktop-*.png \
                  artifacts/screenshots/bellcoria-mobile-*.png \
                  artifacts/screenshots/bellcoria-mobile360-*.png \
                  artifacts/screenshots/bellcoria-qa-board.jpg
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "Refresh Bellcoria QA captures [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
