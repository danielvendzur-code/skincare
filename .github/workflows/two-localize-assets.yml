name: Localize TWO COSMETICS assets

on:
  push:
    branches:
      - agent/skincare-two-kava-parity
    paths:
      - .github/workflows/two-localize-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skincare-two-kava-parity
      - name: Download catalog imagery used by the verified demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/brands/two
          curl --fail --location --retry 3 --silent --show-error 'https://www.lakrem.sk/assets/images/produkty/full/48289-two-ha6-serum.jpg' -o public/assets/brands/two/product-1-full.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://twocosmetics.s14.cdn-upgates.com/_cache/d/7/d7d1eab7fcc81a85650af9a547aefe12-hydratation-1a-1.jpeg' -o public/assets/brands/two/product-2-full.jpeg
          curl --fail --location --retry 3 --silent --show-error 'https://i.makeup.sk/2/2u/2uqfqvm5bfcq.jpg' -o public/assets/brands/two/product-3-full.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://cdn.notinoimg.com/social/two_cosmetics/8588007693200_01-o/problem-skin___230224.jpg' -o public/assets/brands/two/product-4-full.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://www.hebe.pl/on/demandware.static/-/Sites-PL_Master_Catalog/default/dwb2e61ee6/images/hi-res/76247150_zel_oczyszczajacy_do_twarzy_z_kwasem_salicylowym_2__200_ml_1_1270827_MP_p.png' -o public/assets/brands/two/product-5-full.png
          curl --fail --location --retry 3 --silent --show-error 'https://twocosmetics.s14.cdn-upgates.com/_cache/b/7/b7cea98fa30ed04b774961bcd9b7c9dd-podla-typu-pleti-final.jpg' -o public/assets/brands/two/hero-full.jpg
          for file in public/assets/brands/two/*-full.*; do test -s "$file"; done
          file public/assets/brands/two/*-full.*
      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/brands/two/*-full.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Localize TWO COSMETICS catalog imagery [skip ci]'
          git push origin HEAD:agent/skincare-two-kava-parity
