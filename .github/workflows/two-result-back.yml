name: TWO result back-state repair
on:
  push:
    branches:
      - agent/skincare-two-kava-parity
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skincare-two-kava-parity
      - name: Restore result-to-last-question behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          anchor = "  const restart = () => {\n    setStep(0);\n    setAnswers([]);\n    setSelection(null);\n    setTransitioning(false);\n  };\n\n  if (selection?.product) return <Result product={selection.product} alternative={selection.alternative} reason={selection.reason} restart={restart} />;"
          replacement = "  const restart = () => {\n    setStep(0);\n    setAnswers([]);\n    setSelection(null);\n    setTransitioning(false);\n  };\n\n  const backFromResult = () => {\n    setSelection(null);\n    setStep(Math.max(0, questionCount - 1));\n    setTransitioning(false);\n  };\n\n  if (selection?.product) return <Result product={selection.product} alternative={selection.alternative} reason={selection.reason} back={backFromResult} restart={restart} />;"
          if anchor not in s:
              raise SystemExit('Advisor result anchor not found')
          s = s.replace(anchor, replacement, 1)
          s = s.replace("function Result({ product, alternative, reason, restart }) {", "function Result({ product, alternative, reason, back, restart }) {", 1)
          button_anchor = "    {alternative ? <div className=\"alternative\"><span>Alternatíva</span><a href={alternative.url} target=\"_blank\" rel=\"noreferrer\">{alternative.name} · {alternative.price}</a></div> : null}\n    <button className=\"text-button\" onClick={restart}>Vybrať znova</button>"
          button_replacement = "    {alternative ? <div className=\"alternative\"><span>Alternatíva</span><a href={alternative.url} target=\"_blank\" rel=\"noreferrer\">{alternative.name} · {alternative.price}</a></div> : null}\n    <div className=\"result-actions\">\n      <button className=\"text-button\" onClick={back}>Späť k poslednej otázke</button>\n      <button className=\"text-button\" onClick={restart}>Vybrať znova</button>\n    </div>"
          if button_anchor not in s:
              raise SystemExit('Result action anchor not found')
          s = s.replace(button_anchor, button_replacement, 1)
          p.write_text(s)
          Path('.github/workflows/two-result-back.yml').unlink()
          PY
      - name: Commit result navigation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore TWO result back navigation"
          git push origin HEAD:agent/skincare-two-kava-parity
