name: Skincare final quality

on:
  push:
    branches:
      - work/skincare-jolka-parity-final
      - tmp/skincare-header-quality-2026-09-02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skincare-final-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run all skincare regression suites
        run: pnpm exec playwright test tests/skincare-header-quality.spec.js tests/mylo.spec.js tests/ponio.spec.js tests/two.spec.js tests/bellcoria.spec.js tests/biofy.spec.js tests/anemone.spec.js tests/family.spec.js --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skincare-final-quality-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
