name: Anemone branch QA

on:
  push:
    branches:
      - agent/skincare-anemone-kava-parity
    paths-ignore:
      - 'artifacts/screenshots/**'
      - 'ANEMONE_KAVA_PARITY_AUDIT.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium msedge

      - name: Build
        run: pnpm build

      - name: Run Playwright regressions
        env:
          CI: 'true'
        run: pnpm test

      - name: Start preview
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/anemone-preview.log 2>&1 &
          echo $! > /tmp/anemone-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ukazka/anemone >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/anemone-preview.log
          exit 1

      - name: Capture required screenshots
        run: node scripts/capture-qa.mjs

      - name: Build QA board
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/montage.py

      - name: Commit refreshed Anemone QA artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/screenshots/anemone-*.png artifacts/screenshots/anemone-qa-board.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh Anemone QA screenshots [skip ci]'
          git push origin HEAD:agent/skincare-anemone-kava-parity
