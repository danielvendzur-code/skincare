<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2354396e'/%3E%3Cpath d='M16 8c4 3 5 7 0 16-5-9-4-13 0-16Z' fill='white'/%3E%3C/svg%3E" />
    <title>Výber starostlivosti</title>
    <script>
      (() => {
        const brands = new Set(['mylo', 'ponio', 'two', 'bellcoria', 'biofy', 'anemone']);
        const host = location.hostname.toLowerCase();
        const slug = host.endsWith('.mojchatbot.sk') ? host.slice(0, -'.mojchatbot.sk'.length) : '';
        if (brands.has(slug) && (location.pathname === '/' || location.pathname === '')) {
          history.replaceState(null, '', `/ukazka/${slug}${location.search}${location.hash}`);
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
